<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Generator | ManageMyBusiness</title>
    <!-- Icons & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937;
            --danger: #ef4444; --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        
        .container { max-width: 1000px; width: 100%; }
        
        .card { background: var(--card); border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e5e7eb; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .header h2 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
        
        .btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;}
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-secondary { background: white; border: 1px solid #d1d5db; color: var(--text); }
        .btn-danger { color: var(--danger); background: #fee2e2; }
        
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #4b5563; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        input:focus, textarea:focus { border-color: var(--primary); ring: 2px solid var(--primary); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { text-align: left; padding: 10px; background: #f9fafb; color: #6b7280; font-weight: 600; border-bottom: 1px solid #e5e7eb; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        td input { margin: 0; padding: 6px; font-size: 13px; }
        
        .totals-section { display: flex; justify-content: flex-end; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .totals-box { width: 300px; text-align: right; }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .grand-total { font-size: 18px; font-weight: 700; color: var(--primary); border-top: 2px solid #eee; padding-top: 10px; margin-top: 5px; }

        /* Loading Spinner */
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 100; display: none; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="loading-overlay" id="loader">
    <div style="font-weight:600;">Loading Profile...</div>
</div>

<div class="container">
    <div class="card">
        <!-- HEADER -->
        <div class="header">
            <h2><i class="ri-edit-box-line"></i> Manual Document Creator</h2>
            <div style="display:flex; gap:10px;">
                <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-left-line"></i> Back to Dashboard</a>
                <button class="btn btn-primary" onclick="generateManualPDF()"><i class="ri-printer-line"></i> Generate PDF</button>
            </div>
        </div>

        <!-- MAIN SETTINGS -->
        <div class="grid-4" style="background: #f9fafb; padding: 15px; border-radius: 10px; border: 1px solid #e5e7eb;">
            <div>
                <label>Document Type</label>
                <select id="docType">
                    <option value="SALES INVOICE">SALES INVOICE</option>
                    <option value="QUOTATION">QUOTATION</option>
                    <option value="CREDIT NOTE">CREDIT NOTE</option>
                    <option value="PURCHASE ORDER">PURCHASE ORDER</option>
                </select>
            </div>
            <div>
                <label>Document Number</label>
                <input id="docNum" placeholder="e.g. INV-2026-001">
            </div>
            <div>
                <label>Date</label>
                <input type="date" id="docDate">
            </div>
            <div>
                <label>Due Date (Optional)</label>
                <input type="date" id="docDueDate">
            </div>
        </div>

        <!-- DETAILS GRID -->
        <div class="grid-2">
            <!-- Left: Customer -->
            <div>
                <label style="color:var(--primary); font-size:13px;">Customer Details</label>
                <input id="custName" placeholder="Customer Name" style="margin-bottom:10px;">
                <textarea id="custAddr" rows="4" placeholder="Address, Phone Number, Email..."></textarea>
            </div>
            
            <!-- Right: Meta Data -->
            <div>
                <label style="color:var(--primary); font-size:13px;">Order References</label>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div><label>Sales Order No.</label><input id="soNum" placeholder="-"></div>
                    <div><label>Sales Person</label><input id="salesPerson" placeholder="-"></div>
                    <div><label>Vehicle No.</label><input id="vehicle" placeholder="-"></div>
                    <div><label>PO Number</label><input id="poNum" placeholder="-"></div>
                </div>
            </div>
        </div>

        <!-- ITEMS TABLE -->
        <label>Items</label>
        <table>
            <thead>
                <tr>
                    <th style="width:15%;">Code</th>
                    <th style="width:35%;">Description</th>
                    <th style="width:10%;">Qty</th>
                    <th style="width:15%;">Unit Price</th>
                    <th style="width:20%;">Amount</th>
                    <th style="width:5%;"></th>
                </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
        </table>
        <button class="btn btn-secondary" onclick="addRow()" style="margin-top:10px; width:100%;">+ Add Item Row</button>

        <!-- FOOTER & TOTALS -->
        <div class="totals-section">
            <div style="flex:1; padding-right:40px;">
                <label>Remarks / Payment Instructions</label>
                <textarea id="notes" rows="3" placeholder="e.g. Cheques should be drawn in favour of..."></textarea>
            </div>
            <div class="totals-box">
                <div class="total-row">
                    <span>Subtotal</span>
                    <strong id="dispSubtotal">0.00</strong>
                </div>
                <div class="total-row">
                    <span>Discount</span>
                    <input id="inDiscount" type="number" value="0" style="width:80px; text-align:right;" onkeyup="calcTotals()">
                </div>
                <div class="total-row">
                    <span>Tax (%)</span>
                    <input id="inTax" type="number" value="0" style="width:60px; text-align:right;" onkeyup="calcTotals()">
                </div>
                <div class="grand-total" id="dispTotal">0.00</div>
            </div>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // 1. FIREBASE CONFIG (SAME AS YOUR DASHBOARD)
    const firebaseConfig = {
        apiKey: "AIzaSyCZrmkX2RsJTbn4j-WmbuCMudWaETMvXwQ",
        authDomain: "managemybusiness-b4afb.firebaseapp.com",
        projectId: "managemybusiness-b4afb",
        storageBucket: "managemybusiness-b4afb.firebasestorage.app",
        messagingSenderId: "237936848306",
        appId: "1:237936848306:web:91a996c3d1d3ceda3b48ab",
        measurementId: "G-7KPL8EDQ5H"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let profileCache = {}; // Stores logo/biz name
    let currentUser = null;

    // 2. AUTH & LOAD PROFILE
    document.getElementById('loader').style.display = 'flex';
    
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "index.html"; // Redirect if not logged in
        } else {
            currentUser = user;
            await loadBusinessProfile();
        }
    });

    async function loadBusinessProfile() {
        try {
            // Fetch the user's shops to find the Profile ID
            const q = collection(db, `users/${currentUser.uid}/shops`);
            const snap = await getDocs(q);
            
            if (!snap.empty) {
                // Get the first shop found (Assuming single shop or using main shop)
                const shopId = snap.docs[0].id;
                
                // Now fetch profile settings
                const profileSnap = await getDocs(collection(db, `users/${currentUser.uid}/shops/${shopId}/settings`));
                // We need specific doc 'profile'
                // Since `collection` query is generic, let's use direct path if possible, 
                // but simpler to just loop since 'settings' col is small
                profileSnap.forEach(d => {
                    if(d.id === 'profile') profileCache = d.data();
                });
            }
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            console.error(e);
            alert("Error loading business profile. PDF might lack logo.");
            document.getElementById('loader').style.display = 'none';
        }
    }

    // 3. UI LOGIC
    document.getElementById('docDate').valueAsDate = new Date();
    
    // Add default row
    window.addRow = () => {
        const tbody = document.getElementById('itemsBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input class="i-code"></td>
            <td><input class="i-desc"></td>
            <td><input type="number" class="i-qty" value="1" oninput="calcTotals()"></td>
            <td><input type="number" class="i-price" value="0" oninput="calcTotals()"></td>
            <td style="text-align:right; font-weight:bold; padding-right:15px;" class="i-amt">0.00</td>
            <td><button class="btn-danger" style="padding:4px; border-radius:4px; border:none; cursor:pointer;" onclick="this.closest('tr').remove(); calcTotals();">X</button></td>
        `;
        tbody.appendChild(tr);
    };
    window.addRow(); // Add one on start

    window.calcTotals = () => {
        let sub = 0;
        document.querySelectorAll('#itemsBody tr').forEach(tr => {
            const q = parseFloat(tr.querySelector('.i-qty').value) || 0;
            const p = parseFloat(tr.querySelector('.i-price').value) || 0;
            const amt = q * p;
            tr.querySelector('.i-amt').textContent = amt.toFixed(2);
            sub += amt;
        });

        const disc = parseFloat(document.getElementById('inDiscount').value) || 0;
        const tax = parseFloat(document.getElementById('inTax').value) || 0;
        
        const afterDisc = sub - disc;
        const taxAmt = afterDisc * (tax / 100);
        const total = afterDisc + taxAmt;

        document.getElementById('dispSubtotal').textContent = sub.toFixed(2);
        document.getElementById('dispTotal').textContent = total.toFixed(2);
    };

    // 4. PDF GENERATOR (THE IMAGE 3 STYLE)
    window.generateManualPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF(); // A4 Portrait

        const shop = profileCache || {};
        const title = document.getElementById('docType').value;
        const docNum = document.getElementById('docNum').value || '-';
        const date = document.getElementById('docDate').value;
        const dueDate = document.getElementById('docDueDate').value;
        
        // --- STYLING ---
        const primaryColorHex = shop.logoColor || '#1e3a8a';
        const hexToRgb = (hex) => {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [parseInt(result[1], 16), parseInt(result[2], 16), parseInt(result[3], 16)] : [30, 58, 138];
        };
        const themeColor = hexToRgb(primaryColorHex);
        const pageWidth = doc.internal.pageSize.width;
        const margin = 14;

        // 1. HEADER (Left Logo & Name)
        let curY = 15;

        // Logo
        if (shop.logoImage) {
            try {
                doc.addImage(shop.logoImage, 'JPEG', margin, curY, 25, 25);
            } catch (e) {}
        }

        // Business Name
        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.setTextColor(themeColor[0], themeColor[1], themeColor[2]);
        doc.text((shop.bizName || "My Business").toUpperCase(), margin + 30, curY + 8);

        // Address & Contact (Left Aligned under name)
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(0);
        
        let addrY = curY + 14;
        const xOffset = margin + 30;
        
        if(shop.address) {
            const al = doc.splitTextToSize(shop.address, 100);
            doc.text(al, xOffset, addrY);
            addrY += (al.length * 4);
        }
        
        let contactLine = "";
        if(shop.phone1) contactLine += `Tel: ${shop.phone1} `;
        if(shop.email) contactLine += `| Email: ${shop.email}`;
        doc.text(contactLine, xOffset, addrY);

        // 2. TITLE STRIP (Centered, Highlighted)
        let titleY = Math.max(addrY, 50) + 5;
        doc.setFillColor(themeColor[0], themeColor[1], themeColor[2]);
        doc.rect(margin, titleY, pageWidth - (margin*2), 9, 'F');
        
        doc.setTextColor(255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text(title, pageWidth / 2, titleY + 6, { align: "center" });

        // 3. DETAILS SECTION
        let infoY = titleY + 15;
        
        // Left: Customer
        doc.setTextColor(0);
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text("CUSTOMER:", margin, infoY);
        
        const custName = document.getElementById('custName').value || 'Cash Customer';
        const custAddr = document.getElementById('custAddr').value || '';
        
        doc.setFont("helvetica", "normal");
        doc.text(custName, margin, infoY + 5);
        if(custAddr) {
            const ca = doc.splitTextToSize(custAddr, 80);
            doc.text(ca, margin, infoY + 10);
        }

        // Right: Doc Grid (Number, Date, etc)
        const rightX = 110;
        let gridY = infoY;
        const drawRow = (lbl, val) => {
            doc.setFont("helvetica", "bold");
            doc.text(lbl, rightX, gridY);
            doc.setFont("helvetica", "normal");
            doc.text(val, rightX + 40, gridY);
            gridY += 5;
        };

        drawRow("Document No:", docNum);
        drawRow("Date:", date);
        if(dueDate) drawRow("Due Date:", dueDate);
        
        const so = document.getElementById('soNum').value;
        const sp = document.getElementById('salesPerson').value;
        const ve = document.getElementById('vehicle').value;
        const po = document.getElementById('poNum').value;
        
        if(so) drawRow("Sales Order:", so);
        if(sp) drawRow("Sales Person:", sp);
        if(ve) drawRow("Vehicle:", ve);
        if(po) drawRow("PO Number:", po);

        // 4. TABLE
        const tableY = Math.max(gridY, infoY + 25) + 5;
        
        // Collect Table Data
        const items = [];
        document.querySelectorAll('#itemsBody tr').forEach(tr => {
            const c = tr.querySelector('.i-code').value;
            const d = tr.querySelector('.i-desc').value;
            const q = tr.querySelector('.i-qty').value;
            const p = parseFloat(tr.querySelector('.i-price').value).toFixed(2);
            const a = tr.querySelector('.i-amt').textContent;
            if(d || parseFloat(a) > 0) {
                items.push([c, d, q, p, a]);
            }
        });

        doc.autoTable({
            startY: tableY,
            head: [['ITEM CODE', 'DESCRIPTION', 'QTY', 'UNIT PRICE', 'AMOUNT']],
            body: items,
            theme: 'grid',
            headStyles: { fillColor: themeColor, textColor: 255, fontStyle: 'bold', halign: 'center' },
            columnStyles: {
                0: { cellWidth: 30 },
                2: { cellWidth: 20, halign: 'center' },
                3: { cellWidth: 30, halign: 'right' },
                4: { cellWidth: 35, halign: 'right' }
            },
            styles: { fontSize: 9, cellPadding: 3 }
        });

        // 5. FOOTER (Remarks & Totals)
        let finalY = doc.lastAutoTable.finalY + 5;
        const notes = document.getElementById('notes').value;
        
        if(notes) {
            doc.setFontSize(9);
            doc.setFont("helvetica", "bold");
            doc.text("Remarks / Notes:", margin, finalY + 5);
            doc.setFont("helvetica", "normal");
            const nl = doc.splitTextToSize(notes, 100);
            doc.text(nl, margin, finalY + 10);
        }

        const sub = document.getElementById('dispSubtotal').textContent;
        const disc = document.getElementById('inDiscount').value;
        const total = document.getElementById('dispTotal').textContent;
        const totalX = 140;

        doc.setFontSize(10);
        doc.text("Subtotal:", totalX, finalY + 5);
        doc.text(sub, pageWidth - margin, finalY + 5, { align: "right" });

        if(parseFloat(disc) > 0) {
            doc.text("Discount:", totalX, finalY + 10);
            doc.text("-" + parseFloat(disc).toFixed(2), pageWidth - margin, finalY + 10, { align: "right" });
            finalY += 5;
        }

        // Grand Total
        finalY += 12;
        doc.setLineWidth(0.5);
        doc.setDrawColor(themeColor[0], themeColor[1], themeColor[2]);
        doc.line(totalX, finalY, pageWidth - margin, finalY);
        
        doc.setFontSize(12);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(themeColor[0], themeColor[1], themeColor[2]);
        doc.text("TOTAL:", totalX, finalY + 5);
        doc.text(total, pageWidth - margin, finalY + 5, { align: "right" });

        // Signatures
        const pageHeight = doc.internal.pageSize.height;
        const sigY = pageHeight - 30;
        doc.setLineWidth(0.1);
        doc.setDrawColor(0);
        doc.setTextColor(0);
        doc.setFontSize(8);
        doc.setFont("helvetica", "normal");

        doc.line(margin, sigY, margin + 40, sigY);
        doc.text("Prepared By", margin + 5, sigY + 5);

        doc.line(pageWidth - margin - 50, sigY, pageWidth - margin, sigY);
        doc.text("Authorized Signature", pageWidth - margin - 45, sigY + 5);

        doc.save(`${title}_${docNum}.pdf`);
    };

</script>
</body>
</html>
